# Read the Docs (https://docs.readthedocs.io/en/stable/config-file/v2.html)
#
# Combined Sphinx site for ALPS + ligandparam + scission + ffpopt.
# Submodules must be cloned; autodoc binds those checkouts from docs/conf.py.
# Do not pip-install ffpopt-main here: its CMake extension is not needed
# for the API pages.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      - python docs/gen_api.py

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

formats: []

python:
  install:
    - requirements: docs/requirements.txt

submodules:
  include: all
  recursive: true
